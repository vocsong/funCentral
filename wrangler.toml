name = "sgbridgegame"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Adding routes would otherwise turn workers.dev off; the Telegram webhook and
# older links still use https://sgbridgegame.vocs.workers.dev.
workers_dev = true

# Public address (vocs.io zone in the same Cloudflare account).
[[routes]]
pattern = "funcentral.vocs.io"
custom_domain = true

[assets]
directory = "./static"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "REGICIDE_ROOM"
class_name = "RegicideRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RegicideRoom"]

[[d1_databases]]
binding = "DB"
database_name = "sg-bridge-users"
database_id = "d8abefe8-ef5f-47a0-9ba8-9d4dfc72a2af"

[vars]
TELEGRAM_BOT_USERNAME = "funCentral_bot"
